name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime + lint/test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest

      - name: Syntax check
        run: python -m py_compile agent.py

      - name: Ruff lint (E/F only — keep teaching shape)
        run: |
          if [ -d tests ]; then
            ruff check --select E,F --ignore E501 agent.py tests
          else
            ruff check --select E,F --ignore E501 agent.py
          fi

      - name: Unit tests (offline, no real LLM)
        env:
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "tests/ not present yet — syntax + ruff gates only"
          fi
